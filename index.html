<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16305C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Asistencia">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono.svg">
<title>Lista de asistencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  :root{
    --marino:#16305C; --marino-hondo:#0E2143; --oro:#C0A24B;
    --papel:#FCFCFA; --reglado:#DCE0E6; --reglado-fuerte:#B9C0C9;
    --tinta:#1B2028; --tinta-suave:#5A6472; --sel:#EDF1F6;
    --verde:#1E6B45; --rojo:#B3261E; --ambar:#8A6100; --pizarra:#4B5A72;
    --serif:"Libre Baskerville","Iowan Old Style",Palatino,Georgia,serif;
    --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--papel); color:var(--tinta); font-family:var(--sans);
       font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%}
  .hoja{max-width:820px; margin:0 auto; padding:0 20px 90px}
  [hidden]{display:none !important}

  /* ---------- membrete ---------- */
  .membrete{background:var(--marino); border-bottom:3px solid var(--oro); color:#fff}
  .membrete .interior{max-width:820px; margin:0 auto; padding:20px; display:flex;
    justify-content:space-between; align-items:flex-end; gap:18px; flex-wrap:wrap}
  .escuela{font-family:var(--serif); font-weight:700; font-size:23px; line-height:1.25; margin:0}
  .dependencia{margin:5px 0 0; font-size:14px; color:#AFC0DA}
  .membrete-usuario{margin:0; font-size:14px; color:#C9D6E9; display:flex; align-items:center; gap:12px}

  /* ---------- acceso ---------- */
  .entrada{max-width:400px; margin:0 auto; padding:44px 20px 60px}
  .entrada h1{font-family:var(--serif); font-size:24px; line-height:1.3; margin:0 0 6px}
  .entrada p.sub{color:var(--tinta-suave); margin:0 0 26px; font-size:15px}
  .entrada label{display:block; font-size:13.5px; color:var(--tinta-suave); margin:16px 0 5px}
  .entrada input{width:100%}
  .error{color:var(--rojo); font-size:14.5px; margin:16px 0 0}
  .ok{color:var(--verde); font-size:14.5px; margin:16px 0 0}
  .cambiar{margin:20px 0 0; font-size:14.5px; color:var(--tinta-suave)}
  .cambiar button{padding:0; font-size:inherit}

  /* ---------- bloque de identificación ---------- */
  .expediente{background:#fff; border:1px solid var(--reglado-fuerte); border-top:3px solid var(--marino);
    padding:15px 18px 17px; margin:26px 0 0}
  .expediente .ciclo{margin:0 0 8px; font-size:13.5px; color:var(--tinta-suave)}
  .grupo-fila{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  select.grupo{font-family:var(--serif); font-size:22px; font-weight:700; line-height:1.3;
    border:0; background:transparent; color:var(--marino); padding:2px 4px 2px 0; max-width:100%; cursor:pointer}
  select.grupo:focus-visible{outline:2px solid var(--marino); outline-offset:2px}
  .grupo-acciones{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}

  /* ---------- pestañas ---------- */
  nav.pestanas{display:flex; gap:0; margin:0 0 26px; border-bottom:1px solid var(--reglado-fuerte); flex-wrap:wrap}
  nav.pestanas button{font:inherit; font-size:15px; background:none; border:0; border-bottom:3px solid transparent;
    padding:12px 16px; margin-bottom:-1px; color:var(--tinta-suave); cursor:pointer}
  nav.pestanas button:hover{color:var(--marino)}
  nav.pestanas button[aria-selected="true"]{color:var(--marino); border-bottom-color:var(--marino); font-weight:600}
  nav.pestanas button:focus-visible{outline:2px solid var(--marino); outline-offset:-3px}

  /* ---------- controles ---------- */
  .btn, .flechas button{font:inherit; font-size:14px; cursor:pointer; background:#fff; color:var(--tinta);
    border:1px solid var(--reglado-fuerte); border-radius:2px; padding:6px 12px}
  .flechas button{padding:5px 10px; line-height:1}
  .btn:hover, .flechas button:hover{background:var(--sel); border-color:var(--marino)}
  .btn:focus-visible, .flechas button:focus-visible{outline:2px solid var(--marino); outline-offset:1px}
  .btn:disabled{opacity:.5; cursor:default}
  .btn.primario{background:var(--marino); color:#fff; border-color:var(--marino); font-weight:500}
  .btn.primario:hover{background:var(--marino-hondo); border-color:var(--marino-hondo)}
  .btn.peligro{color:var(--rojo); border-color:#DCC2BF}
  .btn.peligro:hover{background:#FBF2F1; border-color:var(--rojo)}
  .btn.enlace{border:0; background:none; padding:4px 2px; color:var(--marino); text-decoration:underline}
  .btn.claro{background:transparent; color:#fff; border-color:rgba(255,255,255,.45)}
  .btn.claro:hover{background:rgba(255,255,255,.12); border-color:#fff}
  input[type=date], input[type=text], input[type=email], input[type=password], textarea{
    font:inherit; color:var(--tinta); background:#fff; border:1px solid var(--reglado-fuerte);
    border-radius:2px; padding:8px 10px}
  input:focus-visible, textarea:focus-visible{outline:2px solid var(--marino); outline-offset:0}
  .flechas{display:flex; gap:5px}

  /* ---------- encabezado del día ---------- */
  .fecha-barra{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:6px}
  .fecha-larga{font-family:var(--serif); font-size:21px; font-weight:700; margin:0; color:var(--tinta)}
  .avance{margin:16px 0 20px; font-size:13.5px; color:var(--tinta-suave); font-variant-numeric:tabular-nums}
  .avance .riel{height:4px; background:var(--reglado); margin-top:7px; position:relative}
  .avance .riel span{position:absolute; inset:0 auto 0 0; background:var(--marino); transition:width .18s ease}

  /* ---------- lista ---------- */
  ol.lista{list-style:none; margin:0; padding:0; border-top:2px solid var(--marino); border-bottom:2px solid var(--marino)}
  ol.lista li{display:flex; align-items:center; gap:12px; padding:6px 0; border-bottom:1px solid var(--reglado)}
  ol.lista li:last-child{border-bottom:0}
  .num{width:38px; flex:none; font-variant-numeric:tabular-nums; font-size:13px; color:var(--tinta-suave);
    text-align:right; padding-right:12px; border-right:1px solid var(--reglado); align-self:stretch;
    display:flex; align-items:center; justify-content:flex-end}
  .nombre{flex:1; min-width:0; font-size:16px; overflow-wrap:anywhere}
  .marcas{display:flex; gap:5px; flex:none; padding-right:2px}
  .marcas button{width:38px; height:36px; border-radius:2px; border:1px solid var(--reglado-fuerte);
    background:#fff; font:inherit; font-size:14px; font-weight:600; color:var(--tinta-suave);
    cursor:pointer; display:grid; place-items:center}
  .marcas button:hover{border-color:var(--marino); color:var(--marino)}
  .marcas button:focus-visible{outline:2px solid var(--marino); outline-offset:1px}
  .marcas button[aria-pressed="true"]{color:#fff; border-color:transparent}
  .marcas button[aria-pressed="true"][data-e="A"]{background:var(--verde)}
  .marcas button[aria-pressed="true"][data-e="F"]{background:var(--rojo)}
  .marcas button[aria-pressed="true"][data-e="R"]{background:var(--ambar)}
  .marcas button[aria-pressed="true"][data-e="J"]{background:var(--pizarra)}
  li:not(.sin-marcar) .nombre{color:var(--tinta-suave)}
  .leyenda{margin-top:16px; font-size:13.5px; color:var(--tinta-suave); display:flex; gap:18px; flex-wrap:wrap}
  .leyenda b{font-weight:700; color:var(--tinta)}
  .acciones{display:flex; gap:9px; flex-wrap:wrap; margin-top:20px}

  /* ---------- alumnos ---------- */
  ul.alumnos{list-style:none; margin:0 0 22px; padding:0; border-top:2px solid var(--marino); border-bottom:1px solid var(--reglado-fuerte)}
  ul.alumnos li{display:flex; align-items:center; gap:12px; padding:7px 0; border-bottom:1px solid var(--reglado)}
  ul.alumnos li:last-child{border-bottom:0}
  textarea{width:100%; min-height:120px; resize:vertical; font-size:15px; line-height:1.6}
  label.campo{display:block; font-size:13.5px; color:var(--tinta-suave); margin:0 0 7px}

  /* ---------- reporte ---------- */
  table{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums}
  th, td{text-align:right; padding:9px 8px; border-bottom:1px solid var(--reglado); font-size:14.5px}
  th:first-child, td:first-child{text-align:left; font-variant-numeric:normal}
  thead th{border-top:2px solid var(--marino); border-bottom:1px solid var(--marino);
    font-weight:600; font-size:13px; color:var(--marino)}
  tbody tr:last-child td{border-bottom:2px solid var(--marino)}
  td.pct{font-weight:600}
  .baja{color:var(--rojo)}

  h2.sec{font-family:var(--serif); font-size:18px; font-weight:700; margin:30px 0 12px; line-height:1.35}
  .vacio{padding:40px 0; color:var(--tinta-suave); max-width:52ch}
  .vacio p{margin:0 0 16px}
  .nota{font-size:14px; color:var(--tinta-suave); max-width:66ch}
  .aviso{position:fixed; left:50%; transform:translateX(-50%); bottom:20px; background:var(--marino);
    color:#fff; padding:10px 18px; border-radius:2px; font-size:14px; opacity:0;
    pointer-events:none; transition:opacity .25s; max-width:90vw; text-align:center}
  .aviso.ver{opacity:1}
  .aviso.mal{background:var(--rojo)}
  #cargando{max-width:400px; margin:0 auto; padding:60px 20px; color:var(--tinta-suave)}

  @media (prefers-reduced-motion: reduce){*{transition:none !important}}
  /* ---------- celular: es donde se pasa lista de verdad ---------- */
  @media (max-width:640px){
    body{padding-bottom:calc(60px + env(safe-area-inset-bottom))}
    .membrete .interior{padding:14px 16px calc(14px);
      padding-left:calc(16px + env(safe-area-inset-left)); padding-right:calc(16px + env(safe-area-inset-right))}
    .escuela{font-size:18px}
    .dependencia{font-size:13px}
    .membrete-usuario{font-size:13px; gap:8px}
    .hoja{padding:0 16px 24px;
      padding-left:calc(16px + env(safe-area-inset-left)); padding-right:calc(16px + env(safe-area-inset-right))}
    .expediente{margin-top:16px; padding:13px 15px 15px}
    select.grupo{font-size:20px; min-height:44px}
    .grupo-acciones .btn{min-height:40px}

    /* el día y el avance quedan fijos mientras se recorre la lista */
    .cabezal-dia{position:sticky; top:0; z-index:5; background:var(--papel);
      margin:0 -16px; padding:12px 16px 8px; border-bottom:1px solid var(--reglado)}
    .fecha-larga{font-size:18px}
    .avance{margin:10px 0 0; font-size:13px}
    ol.lista{margin-top:14px}

    /* fila de alumno: nombre arriba, marcas abajo a todo lo ancho */
    ol.lista li{flex-wrap:wrap; gap:0; padding:9px 0 10px}
    .num{align-self:auto; border-right:0; width:30px; padding-right:8px; font-size:12.5px}
    .nombre{flex-basis:calc(100% - 30px); font-size:15.5px; line-height:1.35}
    .marcas{width:100%; gap:6px; margin-top:8px; padding-left:30px}
    .marcas button{flex:1; width:auto; height:46px; font-size:16px}

    .leyenda{gap:12px; font-size:13px}
    .acciones{gap:8px}
    .acciones .btn{flex:1 1 46%; min-height:44px; text-align:center; justify-content:center}

    /* pestañas al alcance del pulgar */
    nav.pestanas{position:fixed; left:0; right:0; bottom:0; z-index:20; margin:0;
      background:#fff; border-top:1px solid var(--reglado-fuerte); border-bottom:0;
      padding-bottom:env(safe-area-inset-bottom); box-shadow:0 -1px 0 rgba(22,48,92,.04)}
    nav.pestanas button{flex:1; padding:13px 4px; margin:0; font-size:13px;
      border-bottom:0; border-top:3px solid transparent}
    nav.pestanas button[aria-selected="true"]{border-top-color:var(--marino); border-bottom-color:transparent}
    main#vista{padding-top:4px}

    table{font-size:13.5px}
    th, td{padding:8px 4px}
    th:first-child, td:first-child{max-width:38vw; overflow-wrap:anywhere}
    .entrada{padding:28px 20px 40px}
    .entrada input{min-height:46px}
    .btn.primario{min-height:46px}
    textarea{min-height:150px}
  }
  @media (max-width:360px){
    .marcas button{height:44px; font-size:15px}
    .marcas{padding-left:0}
    .nombre{flex-basis:calc(100% - 30px)}
  }
  /* en celular el teclado de iOS hace zoom si la letra baja de 16px */
  input, select, textarea{font-size:16px}

  /* ---------- impresión: el acta que se entrega en prefectura ---------- */
  @media print{
    body{background:#fff; font-size:11pt}
    .hoja{padding:0; max-width:100%}
    .membrete{background:#fff; color:#000; border-bottom:2px solid #000}
    .membrete .interior{padding:0 0 8px}
    .dependencia, .membrete-usuario{color:#000}
    .expediente{border:0; border-top:0; padding:10px 0 0; margin:0}
    select.grupo{color:#000; appearance:none}
    nav.pestanas, .acciones, .flechas, .avance .riel, input[type=date],
    .btn, .cambiar, .aviso, textarea, label.campo{display:none !important}
    ol.lista li{break-inside:avoid; padding:3px 0}
    .marcas button{border:0; background:none !important; color:#000 !important; width:auto; height:auto; padding:0 4px}
    .marcas button[aria-pressed="false"]{display:none}
    .marcas button[aria-pressed="true"]{font-weight:700}
    thead{display:table-header-group}
    tr{break-inside:avoid}
    a[href]:after{content:""}
  }
</style>

<!-- pantalla de acceso -->
<section id="acceso" hidden>
  <header class="membrete">
    <div class="interior">
      <div>
        <p class="escuela" id="escuelaAcceso">Escuela Secundaria</p>
        <p class="dependencia">Registro de asistencia</p>
      </div>
    </div>
  </header>
  <div class="entrada">
    <h1 id="tituloEntrada">Entrar al registro</h1>
    <p class="sub" id="subEntrada">Usa el correo y la contraseña de tu cuenta.</p>

  <div id="campoNombre" hidden>
    <label for="nombreMaestro">Tu nombre</label>
    <input type="text" id="nombreMaestro" autocomplete="name" placeholder="Profa. María Hernández">
  </div>

  <label for="correo">Correo</label>
  <input type="email" id="correo" autocomplete="username" inputmode="email">

  <label for="pass">Contraseña</label>

  <div id="campoPass2" hidden>
    <label for="pass2">Repite la contraseña</label>
    <input type="password" id="pass2" autocomplete="new-password">
  </div>

  <div class="acciones">

  </div>
  <p class="cambiar">
    <span id="textoCambiar">¿Todavía no tienes cuenta?</span>
    <button class="btn enlace" id="btnCambiarModo">Crear una</button>
  </p>
  </div>
</section>

<!-- aplicación -->
<div id="app" hidden>
  <header class="membrete">
    <div class="interior">
      <div>
        <p class="escuela" id="escuela">Escuela Secundaria</p>
        <p class="dependencia">Registro de asistencia</p>
      </div>
      <p class="membrete-usuario">
        <span id="quien"></span>
        <button class="btn claro" id="btnSalir">Cerrar sesión</button>
      </p>
    </div>
  </header>

  <div class="hoja">
    <div class="expediente">
      <p class="ciclo" id="ciclo"></p>
      <div class="grupo-fila">
        <select class="grupo" id="selGrupo" aria-label="Grupo"></select>
      </div>
      <div class="grupo-acciones">
        <button class="btn" id="btnNuevoGrupo">Nuevo grupo</button>
        <button class="btn" id="btnRenombrar">Cambiar nombre</button>
        <button class="btn peligro" id="btnBorrarGrupo">Borrar grupo</button>
      </div>
    </div>

    <nav class="pestanas" role="tablist">
      <button role="tab" data-v="lista" aria-selected="true">Pasar lista</button>
      <button role="tab" data-v="alumnos" aria-selected="false">Alumnos</button>
      <button role="tab" data-v="reporte" aria-selected="false">Reporte</button>
      <button role="tab" data-v="datos" aria-selected="false">Descargar</button>
    </nav>

    <main id="vista"></main>
  </div>
</div>

<p class="entrada" id="cargando">Cargando…</p>
<div class="aviso" id="aviso" role="status"></div>

<script src="config.js"></script>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const sb = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

const ESTADOS = [
  {e:'A', etq:'✓', nom:'Asistencia'},
  {e:'F', etq:'F', nom:'Falta'},
  {e:'R', etq:'R', nom:'Retardo'},
  {e:'J', etq:'J', nom:'Justificada'},
];
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

let grupos = [];        // [{id, nombre, alumnos:[{id,nombre,orden}], registros:{fecha:{alumnoId:estado}}}]
let activo = null;
let vista = 'lista';
let fecha = hoy();

const $ = s => document.querySelector(s);

function hoy(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fechaLarga(iso){
  const [a,m,d] = iso.split('-').map(Number);
  return `${DIAS[new Date(a,m-1,d).getDay()]} ${d} de ${MESES[m-1]}`;
}
function mueveDia(iso,n){
  const [a,m,d] = iso.split('-').map(Number);
  const f = new Date(a,m-1,d+n);
  return `${f.getFullYear()}-${String(f.getMonth()+1).padStart(2,'0')}-${String(f.getDate()).padStart(2,'0')}`;
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function grupo(){ return grupos.find(g => g.id === activo) || null; }

function avisar(txt, mal){
  const a = $('#aviso');
  a.textContent = txt;
  a.classList.toggle('mal', !!mal);
  a.classList.add('ver');
  clearTimeout(a._t); a._t = setTimeout(()=>a.classList.remove('ver'), mal ? 4000 : 1400);
}
// Envuelve cada escritura: si Supabase falla, el maestro se entera y se recarga
// el estado real para que la pantalla nunca mienta sobre lo que quedó guardado.
async function escribir(fn, ok){
  try{
    const r = await fn();
    if(r && r.error) throw r.error;
    if(ok) avisar(ok);
    return true;
  }catch(err){
    console.error(err);
    avisar('No se guardó: ' + (err.message || 'revisa tu conexión'), true);
    await cargarTodo(); pintar();
    return false;
  }
}

/* ---------------- sesión ---------------- */
function cicloEscolar(){
  const d = new Date(), a = d.getFullYear();
  // el ciclo arranca en agosto: antes de esa fecha seguimos en el ciclo anterior
  return d.getMonth() >= 7 ? `Ciclo escolar ${a}\u2013${a+1}` : `Ciclo escolar ${a-1}\u2013${a}`;
}
function pintarMembrete(){
  const nombre = window.ESCUELA || 'Escuela Secundaria';
  $('#escuela').textContent = nombre;
  $('#escuelaAcceso').textContent = nombre;
  $('#ciclo').textContent = window.CICLO || cicloEscolar();
}

async function iniciar(){
  if(!window.SUPABASE_URL || window.SUPABASE_URL.includes('TU-PROYECTO')){
    $('#cargando').innerHTML = 'Falta poner la dirección y la llave de tu proyecto en <b>config.js</b>.';
    return;
  }
  pintarMembrete();
  const { data } = await sb.auth.getSession();
  $('#cargando').hidden = true;
  if(data.session) await abrirApp(data.session);
  else { pintarEntrada(); $('#acceso').hidden = false; }
}
async function abrirApp(sesion){
  $('#acceso').hidden = true;
  $('#app').hidden = false;
  $('#quien').textContent = (sesion.user.user_metadata && sesion.user.user_metadata.nombre) || sesion.user.email;
  await cargarTodo();
  pintar();
}
let modo = 'entrar';   // 'entrar' o 'registro'

// Los mensajes de Supabase llegan en inglés; los que salen a diario
// se traducen para que el maestro entienda qué corregir.
const TRADUCCIONES = [
  [/invalid login credentials/i, 'El correo o la contraseña no coinciden.'],
  [/email not confirmed/i, 'Falta confirmar tu correo. Busca el mensaje que te enviamos.'],
  [/user already registered|already been registered/i, 'Ese correo ya tiene cuenta. Entra con tu contraseña.'],
  [/password should be at least (\d+)/i, 'La contraseña necesita al menos 6 caracteres.'],
  [/signups? not allowed|signup is disabled/i, 'El registro está cerrado en este momento.'],
  [/unable to validate email|invalid email/i, 'Ese correo no parece válido.'],
  [/for security purposes|rate limit|too many requests/i, 'Demasiados intentos seguidos. Espera un minuto.'],
];
function traducir(msg){
  for(const [re, texto] of TRADUCCIONES) if(re.test(msg)) return texto;
  return msg;
}

function pintarEntrada(){
  const reg = modo === 'registro';
  $('#tituloEntrada').textContent = reg ? 'Crear una cuenta' : 'Entrar al registro';
  $('#subEntrada').textContent = reg
    ? 'Los grupos que registres los verás únicamente tú.'
    : 'Usa el correo y la contraseña de tu cuenta.';
  $('#campoNombre').hidden = !reg;
  $('#campoPass2').hidden = !reg;
  $('#btnPrincipal').textContent = reg ? 'Crear mi cuenta' : 'Entrar';
  $('#pass').autocomplete = reg ? 'new-password' : 'current-password';
  $('#textoCambiar').textContent = reg ? '¿Ya tienes cuenta?' : '¿Todavía no tienes cuenta?';
  $('#btnCambiarModo').textContent = reg ? 'Entrar' : 'Crear una';
  $('#errorEntrada').hidden = true;
  $('#okEntrada').hidden = true;
}
$('#btnCambiarModo').onclick = () => {
  modo = modo === 'registro' ? 'entrar' : 'registro';
  pintarEntrada();
};
$('#btnPrincipal').onclick = enviar;
['#correo','#pass','#pass2','#nombreMaestro'].forEach(s =>
  $(s).onkeydown = e => { if(e.key === 'Enter') enviar(); });

function fallo(texto){
  const err = $('#errorEntrada');
  err.textContent = texto; err.hidden = false;
  $('#okEntrada').hidden = true;
  $('#btnPrincipal').disabled = false;
}

async function enviar(){
  $('#errorEntrada').hidden = true;
  $('#okEntrada').hidden = true;
  $('#btnPrincipal').disabled = true;

  const correo = $('#correo').value.trim();
  const pass = $('#pass').value;
  if(!correo || !pass) return fallo('Escribe tu correo y tu contraseña.');

  if(modo === 'registro'){
    const nombre = $('#nombreMaestro').value.trim();
    if(!nombre) return fallo('Escribe tu nombre.');
    if(pass.length < 6) return fallo('La contraseña necesita al menos 6 caracteres.');
    if(pass !== $('#pass2').value) return fallo('Las dos contraseñas no son iguales.');

    const { data, error } = await sb.auth.signUp({
      email: correo, password: pass, options: { data: { nombre } }
    });
    $('#btnPrincipal').disabled = false;
    if(error) return fallo(traducir(error.message));

    if(data.session){          // el proyecto no pide confirmación: entra directo
      limpiarCampos();
      return abrirApp(data.session);
    }
    // el proyecto sí pide confirmación por correo
    const ok = $('#okEntrada');
    ok.textContent = `Cuenta creada. Te mandamos un correo a ${correo}: ábrelo, confirma tu cuenta y regresa aquí para entrar.`;
    ok.hidden = false;
    modo = 'entrar';
    $('#tituloEntrada').textContent = 'Entrar al registro';
    $('#subEntrada').textContent = 'Usa el correo y la contraseña de tu cuenta.';
    $('#campoNombre').hidden = true;
    $('#campoPass2').hidden = true;
    $('#btnPrincipal').textContent = 'Entrar';
    $('#textoCambiar').textContent = '¿Todavía no tienes cuenta?';
    $('#btnCambiarModo').textContent = 'Crear una';
    $('#pass').value = ''; $('#pass2').value = '';
    return;
  }

  const { data, error } = await sb.auth.signInWithPassword({ email: correo, password: pass });
  $('#btnPrincipal').disabled = false;
  if(error) return fallo(traducir(error.message));
  limpiarCampos();
  await abrirApp(data.session);
}
function limpiarCampos(){
  $('#pass').value = ''; $('#pass2').value = ''; $('#nombreMaestro').value = '';
}
$('#btnSalir').onclick = async () => { await sb.auth.signOut(); location.reload(); };

/* ---------------- lectura ---------------- */
async function cargarTodo(){
  const [g, a, s] = await Promise.all([
    sb.from('grupos').select('*').order('creado_at'),
    sb.from('alumnos').select('*').order('orden'),
    sb.from('asistencias').select('*'),
  ]);
  if(g.error || a.error || s.error){
    avisar('No se pudieron leer los datos. ¿Ya corriste el archivo esquema.sql?', true);
    return;
  }
  grupos = g.data.map(x => ({id:x.id, nombre:x.nombre, alumnos:[], registros:{}}));
  const porId = Object.fromEntries(grupos.map(x => [x.id, x]));
  a.data.forEach(al => porId[al.grupo_id] && porId[al.grupo_id].alumnos.push({id:al.id, nombre:al.nombre, orden:al.orden}));
  s.data.forEach(r => {
    const gr = porId[r.grupo_id]; if(!gr) return;
    (gr.registros[r.fecha] = gr.registros[r.fecha] || {})[r.alumno_id] = r.estado;
  });
  if(!grupos.find(x => x.id === activo)) activo = grupos[0] ? grupos[0].id : null;
}

$('#btnNuevoGrupo').onclick = async () => {

$('#btnBorrarGrupo').onclick = async () => {

document.querySelectorAll('nav.pestanas button').forEach(b => b.onclick = () => { vista = b.dataset.v; pintar(); });

/* ---------------- render ---------------- */
function pintar(){
  pintarGrupos();
  document.querySelectorAll('nav.pestanas button').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.v === vista)));
  const cont = $('#vista');
  if(vista === 'datos') return pintarDatos(cont);
  const g = grupo();
  if(!g){
    cont.innerHTML = `<div class="vacio">
      <p>Aquí no hay nada todavía. Crea tu primer grupo para empezar a pasar lista.</p>
      <button class="btn primario" onclick="document.getElementById('btnNuevoGrupo').click()">Crear un grupo</button></div>`;
    return;
  }
  if(vista === 'lista') pintarLista(cont, g);
  if(vista === 'alumnos') pintarAlumnos(cont, g);
  if(vista === 'reporte') pintarReporte(cont, g);
}

/* ---------------- pasar lista ---------------- */
function pintarLista(cont, g){

    $('#irAlumnos').onclick = () => { vista='alumnos'; pintar(); };
    return;
  }
  const dia = g.registros[fecha] || {};
  const marcados = g.alumnos.filter(a => dia[a.id]).length;

  cont.innerHTML = `
    <div class="cabezal-dia">
    <div class="fecha-barra">
      <h1 class="fecha-larga">${fechaLarga(fecha)}</h1>
      <div class="flechas">

    </div>
    <ol class="lista">
      ${g.alumnos.map((a,i) => `
        <li class="${dia[a.id]?'':'sin-marcar'}">

          <span class="nombre">${esc(a.nombre)}</span>
          <span class="marcas">
            ${ESTADOS.map(s => `<button data-a="${a.id}" data-e="${s.e}" aria-pressed="${dia[a.id]===s.e}"
              title="${s.nom}" aria-label="${s.nom} para ${esc(a.nombre)}">${s.etq}</button>`).join('')}
          </span>
        </li>`).join('')}
    </ol>
    <p class="leyenda"><span><b>✓</b> asistencia</span><span><b>F</b> falta</span>
      <span><b>R</b> retardo</span><span><b>J</b> falta justificada</span></p>
    <div class="acciones">
      <button class="btn primario" id="todosPresentes">Marcar todos con asistencia</button>
      <button class="btn" id="faltanLosDemas">Los que faltan por marcar: falta</button>
      <button class="btn peligro" id="limpiarDia">Borrar las marcas del día</button>
      <button class="btn" id="imprimirDia">Imprimir esta lista</button>
    </div>`;

  $('#ant').onclick = () => { fecha = mueveDia(fecha,-1); pintar(); };
  $('#sig').onclick = () => { fecha = mueveDia(fecha, 1); pintar(); };
  $('#inpFecha').onchange = e => { if(e.target.value){ fecha = e.target.value; pintar(); } };
  const bh = $('#irHoy'); if(bh) bh.onclick = () => { fecha = hoy(); pintar(); };

  cont.querySelectorAll('.marcas button').forEach(b => b.onclick = async () => {
    const alumnoId = b.dataset.a, estado = b.dataset.e;
    const d = g.registros[fecha] = g.registros[fecha] || {};
    if(d[alumnoId] === estado){
      delete d[alumnoId]; pintar();
      await escribir(() => sb.from('asistencias').delete().eq('alumno_id',alumnoId).eq('fecha',fecha));
    }else{
      d[alumnoId] = estado; pintar();

async function marcarVarios(g, quePonerle){
  const filas = g.alumnos.map(a => ({grupo_id:g.id, alumno_id:a.id, fecha, estado:quePonerle(a)}));
  g.registros[fecha] = Object.fromEntries(filas.map(f => [f.alumno_id, f.estado]));
  pintar();
  await escribir(() => sb.from('asistencias').upsert(filas, {onConflict:'alumno_id,fecha'}), 'Listo');
}

/* ---------------- alumnos ---------------- */
function pintarAlumnos(cont, g){

    <ul class="alumnos">
      ${g.alumnos.map((a,i) => `<li>

    <label class="campo" for="nuevos">Escribe un nombre por renglón. Puedes pegar la lista completa de una vez.</label>

  cont.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {

  });

    const a = g.alumnos.find(x => x.id === b.dataset.ed);

  $('#agregar').onclick = async () => {

/* ---------------- reporte ---------------- */
function resumen(g){
  const dias = Object.keys(g.registros).sort();
  return g.alumnos.map(a => {
    let A=0,F=0,R=0,J=0,reg=0;
    dias.forEach(d => {
      const e = g.registros[d][a.id]; if(!e) return;
      reg++;
      if(e==='A')A++; else if(e==='F')F++; else if(e==='R')R++; else J++;
    });
    return {a,A,F,R,J,reg,pct: reg ? Math.round((A+R)/reg*100) : null};
  });
}
function pintarReporte(cont, g){
  const dias = Object.keys(g.registros).sort();
  if(!dias.length || !g.alumnos.length){
    cont.innerHTML = `<div class="vacio"><p>El reporte se llena solo conforme pases lista. Marca la asistencia de un día y vuelve aquí.</p></div>`;
    return;
  }
  const filas = resumen(g);
  const conDatos = filas.filter(f => f.pct !== null);
  const prom = conDatos.length ? Math.round(conDatos.reduce((s,f)=>s+f.pct,0)/conDatos.length) : null;
  cont.innerHTML = `
    <h2 class="sec">${dias.length} día${dias.length===1?'':'s'} registrados · asistencia promedio ${prom===null?'—':prom+'%'}</h2>
    <table>
      <thead><tr><th>Alumno</th><th>✓</th><th>R</th><th>F</th><th>J</th><th>Asistencia</th></tr></thead>
      <tbody>${filas.map(f => `<tr><td>${esc(f.a.nombre)}</td><td>${f.A}</td><td>${f.R}</td><td>${f.F}</td><td>${f.J}</td>
        <td class="pct ${f.pct!==null && f.pct<80?'baja':''}">${f.pct===null?'—':f.pct+'%'}</td></tr>`).join('')}</tbody>
    </table>
    <p class="leyenda">La asistencia cuenta ✓ y R sobre los días en que el alumno tuvo marca. Las justificadas se muestran aparte. En rojo, quienes van por debajo del 80%.</p>
    <div class="acciones">
      <button class="btn primario" id="csv">Descargar este grupo (CSV)</button>
      <button class="btn" id="imprimirRep">Imprimir el reporte</button>
    </div>`;

  $('#imprimirRep').onclick = () => window.print();

  $('#csv').onclick = () => {
    const lineas = [['Alumno', ...dias, 'Asistencias','Retardos','Faltas','Justificadas','% asistencia']];
    filas.forEach(f => lineas.push([f.a.nombre, ...dias.map(d => g.registros[d][f.a.id] || ''),
      f.A, f.R, f.F, f.J, f.pct===null?'':f.pct+'%']));
    bajar(aCsv(lineas), `asistencia-${limpio(g.nombre)}.csv`, 'text/csv');
  };
}

/* ---------------- descargar ---------------- */
function pintarDatos(cont){
  cont.innerHTML = `
    <h2 class="sec">Descarga tu información cuando quieras</h2>
    <p class="nota">Todo vive en tu base de datos de Supabase. Estas descargas son copias que se generan en el momento, con lo que hay guardado ahora mismo.</p>
    <div class="acciones">
      <button class="btn primario" id="todoCsv">Todos los grupos (CSV)</button>
      <button class="btn" id="todoJson">Respaldo completo (JSON)</button>
    </div>
    <h2 class="sec">Restaurar desde un respaldo</h2>
    <p class="nota">Sube un archivo JSON descargado antes. Los grupos se agregan como nuevos; nada de lo que ya tienes se borra ni se reemplaza.</p>
    <div class="acciones">
      <input type="file" id="archivo" accept="application/json,.json">
      <button class="btn" id="restaurar">Restaurar</button>
    </div>`;

  $('#todoCsv').onclick = () => {
    const lineas = [['Grupo','Alumno','Fecha','Estado','Significado']];
    const nombre = {A:'Asistencia', F:'Falta', R:'Retardo', J:'Justificada'};
    grupos.forEach(g => {
      const porAlumno = Object.fromEntries(g.alumnos.map(a => [a.id, a.nombre]));
      Object.keys(g.registros).sort().forEach(f => {
        Object.entries(g.registros[f]).forEach(([alumnoId, e]) => {
          if(porAlumno[alumnoId]) lineas.push([g.nombre, porAlumno[alumnoId], f, e, nombre[e]]);
        });
      });
    });
    if(lineas.length === 1) return avisar('Todavía no hay asistencias registradas.', true);
    bajar(aCsv(lineas), `asistencia-completa-${hoy()}.csv`, 'text/csv');
  };
  $('#todoJson').onclick = () => {
    const copia = {version:1, exportado:new Date().toISOString(), grupos};
    bajar(JSON.stringify(copia, null, 2), `respaldo-asistencia-${hoy()}.json`, 'application/json');
  };
  $('#restaurar').onclick = async () => {
    const f = $('#archivo').files[0];
    if(!f) return avisar('Primero elige un archivo.', true);
    let copia;
    try{ copia = JSON.parse(await f.text()); }
    catch{ return avisar('Ese archivo no es un respaldo válido.', true); }
    if(!copia.grupos || !Array.isArray(copia.grupos)) return avisar('Ese archivo no es un respaldo válido.', true);
    if(!confirm(`Se agregarán ${copia.grupos.length} grupo(s) del respaldo. ¿Continuar?`)) return;
    try{
      for(const g of copia.grupos){
        const ng = (await sb.from('grupos').insert({nombre: g.nombre + ' (restaurado)'}).select().single()).data;
        const alumnos = (g.alumnos || []).map((a,i) => ({grupo_id:ng.id, nombre:a.nombre, orden:a.orden ?? i+1}));
        if(!alumnos.length) continue;
        const nuevos = (await sb.from('alumnos').insert(alumnos).select()).data;
        const mapa = {};
        (g.alumnos || []).forEach((a,i) => { if(nuevos[i]) mapa[a.id] = nuevos[i].id; });
        const marcas = [];
        Object.entries(g.registros || {}).forEach(([fch, d]) =>
          Object.entries(d).forEach(([viejo, e]) => {
            if(mapa[viejo]) marcas.push({grupo_id:ng.id, alumno_id:mapa[viejo], fecha:fch, estado:e});
          }));
        for(let i = 0; i < marcas.length; i += 500){
          await sb.from('asistencias').insert(marcas.slice(i, i+500));
        }
      }
      await cargarTodo(); pintar(); avisar('Respaldo restaurado');
    }catch(err){
      console.error(err); avisar('Falló la restauración: ' + (err.message || ''), true);
    }
  };
}

/* ---------------- utilidades de archivo ---------------- */
function aCsv(lineas){
  return '\uFEFF' + lineas.map(l => l.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
}
function limpio(s){ return s.replace(/[^\w\sáéíóúñÁÉÍÓÚÑ-]/g,'').trim().replace(/\s+/g,'-'); }
function bajar(texto, nombre, tipo){
  const url = URL.createObjectURL(new Blob([texto], {type: tipo + ';charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url; a.download = nombre; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
